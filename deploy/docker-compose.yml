services:
  bidarcrm:
    container_name: bidarcrm-app
    image: arm64v8/wordpress
    platform: linux/arm64/v8
    restart: "no"
    ports:
      - "8089:80"
    environment:
      VIRTUAL_HOST: bidarcrm.test,bidar.test
      VIRTUAL_PORT: 80
      CERT_NAME: bidarcrm.test
    volumes:
      - ./source:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/bidar.ini:ro
    command: >
      bash -c "
      php -m | grep -q pdo_mysql || docker-php-ext-install pdo_mysql &&
      a2enmod rewrite &&
      a2enmod headers &&
      apache2-foreground
      "

  bidarcrmdb:
    container_name: bidarcrmdb
    image: arm64v8/mysql
    platform: linux/arm64/v8
    restart: "no"
    mem_limit: 1g
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=100
    ports:
      - "3316:3306"
    environment:
      MYSQL_DATABASE: bidarcrm
      MYSQL_USER: bidaruser
      MYSQL_PASSWORD: bidarpass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql/log:/var/log/mysql
      - bidarcrmdb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    container_name: bidarcrm-pma
    depends_on:
      bidarcrmdb:
        condition: service_healthy
    image: arm64v8/phpmyadmin
    platform: linux/arm64/v8
    restart: "no"
    environment:
      VIRTUAL_HOST: pma.bidarcrm.test
      VIRTUAL_PORT: 80
      CERT_NAME: pma.bidarcrm.test
      PMA_HOST: bidarcrmdb
      PMA_USER: bidaruser
      PMA_PASSWORD: bidarpass

volumes:
  bidarcrmdb:

networks:
  default:
    name: shared_net
    external: true
