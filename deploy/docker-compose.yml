services:
  bidarcrm:
    container_name: bidarcrm-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8089:80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
    volumes:
      - ./source:/var/www/html
    depends_on:
      bidarcrmdb:
        condition: service_healthy

  bidarcrmdb:
    container_name: bidarcrmdb
    image: mariadb:11.4
    restart: unless-stopped
    mem_limit: 1g
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=100
    ports:
      - "127.0.0.1:3316:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bidarcrm}
      MYSQL_USER: ${MYSQL_USER:-bidaruser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bidarpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bidarroot}
    volumes:
      - bidarcrmdb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    container_name: bidarcrm-pma
    depends_on:
      bidarcrmdb:
        condition: service_healthy
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: bidarcrmdb
      PMA_USER: ${MYSQL_USER:-bidaruser}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-bidarpass}

volumes:
  bidarcrmdb:
