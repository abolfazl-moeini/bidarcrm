<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقویم فروش و فعالیت‌ها - BidarCRM</title>
  
  
  <style>
    body { font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <link rel="stylesheet" href="./assets/bidar-styles.css">
</head>
<body class="bg-slate-950 text-slate-100 p-6 min-h-screen">
  <div class="space-y-6 flex flex-col h-full max-w-7xl mx-auto" dir="rtl">
    <!-- Top Header -->
    <div class="flex items-center justify-between border-b border-slate-800/80 pb-5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/15 border border-indigo-500/20 text-indigo-400 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold text-slate-100 tracking-tight">فعالیت‌ها و تقویم</h1>
            <span class="text-xs font-medium text-slate-400 bg-slate-800 px-2.5 py-0.5 rounded-md">۳ فعالیت</span>
          </div>
          <p class="text-xs text-slate-400 mt-1">مدیریت وظایف، تماس‌ها و جلسات کاری</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex items-center p-1 bg-slate-900 border border-slate-800 rounded-xl text-xs">
          <button class="px-3 py-1.5 rounded-lg text-slate-400">نمای لیستی</button>
          <button class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white">تقویم شمسی</button>
        </div>
        <button class="px-4 py-2 bg-indigo-600 text-white text-xs font-medium rounded-xl">+ فعالیت جدید</button>
      </div>
    </div>

    <!-- Jalali Calendar Grid -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-sm">
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
        <div class="flex items-center gap-3">
          <h2 class="text-base font-bold text-slate-100">آذر ۱۴۰۵</h2>
          <span class="text-xs text-slate-400">تقویم پیگیری‌ها و برنامه‌ریزی فروش</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs">
          <button class="p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded-xl transition">ماه قبل</button>
          <button class="px-3 py-1.5 rounded-xl border border-slate-800 text-slate-300">امروز</button>
          <button class="p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded-xl transition">ماه بعد</button>
        </div>
      </div>

      <!-- Weekdays -->
      <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400 border-b border-slate-800/60 pb-2">
        <div>شنبه</div>
        <div>یکشنبه</div>
        <div>دوشنبه</div>
        <div>سه‌شنبه</div>
        <div>چهارشنبه</div>
        <div>پنج‌شنبه</div>
        <div>جمعه</div>
      </div>

      <!-- Days Grid -->
      <div class="grid grid-cols-7 gap-2">
        <!-- 30 days sample -->
        <div class="min-h-20 p-2 rounded-xl border bg-indigo-600/10 border-indigo-500/40 text-indigo-300">
          <div class="flex justify-between items-center text-xs font-bold font-mono">
            <span>۱</span>
            <span class="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-300 text-[10px] flex items-center justify-center">۱</span>
          </div>
          <div class="mt-2 text-[10px] p-1 rounded bg-slate-800/80 text-slate-200 truncate">تماس با پتروشیمی</div>
        </div>
        <div class="min-h-20 p-2 rounded-xl border bg-slate-950/60 border-slate-800 text-slate-300">
          <div class="flex justify-between items-center text-xs font-bold font-mono">
            <span>۲</span>
            <span class="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-300 text-[10px] flex items-center justify-center">۱</span>
          </div>
          <div class="mt-2 text-[10px] p-1 rounded bg-slate-800/80 text-slate-200 truncate">جلسه دمو نرم‌افزار</div>
        </div>
        <div class="min-h-20 p-2 rounded-xl border bg-slate-950/30 border-slate-800/50 text-slate-500 font-mono text-xs font-bold p-2">۳</div>
        <div class="min-h-20 p-2 rounded-xl border bg-slate-950/30 border-slate-800/50 text-slate-500 font-mono text-xs font-bold p-2">۴</div>
        <div class="min-h-20 p-2 rounded-xl border bg-slate-950/30 border-slate-800/50 text-slate-500 font-mono text-xs font-bold p-2">۵</div>
        <div class="min-h-20 p-2 rounded-xl border bg-slate-950/30 border-slate-800/50 text-slate-500 font-mono text-xs font-bold p-2">۶</div>
        <div class="min-h-20 p-2 rounded-xl border bg-slate-950/30 border-slate-800/50 text-slate-500 font-mono text-xs font-bold p-2">۷</div>
      </div>
    </div>
  </div>
</body>
</html>
