<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سامانه بیدار - BidarCRM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-slate-100">
  <div class="bidar-login-card w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-2xl shadow-2xl p-8 backdrop-blur-md text-right">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 mb-4 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-100 tracking-tight">ورود به سامانه بیدار</h1>
      <p class="text-sm text-slate-400 mt-2">سامانه یکپارچه مدیریت ارتباط با مشتری</p>
    </div>

    <form class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-300 mb-2">نام کاربری یا ایمیل</label>
        <div class="relative">
          <input id="username" name="username" type="text" dir="ltr" class="w-full pr-11 pl-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500" placeholder="admin" />
        </div>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-300 mb-2">رمز عبور</label>
        <div class="relative">
          <input id="password" name="password" type="password" dir="ltr" class="w-full pr-11 pl-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500" placeholder="••••••••" />
        </div>
      </div>
      <button type="submit" class="w-full mt-2 py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/25">
        ورود به سامانه
      </button>
    </form>
  </div>
  <footer class="mt-8 text-center text-xs text-slate-500 font-normal">
    <p>© ۱۴۰۳ بیدار (BidarCRM) — تمامی حقوق محفوظ است.</p>
  </footer>
</body>
</html>
