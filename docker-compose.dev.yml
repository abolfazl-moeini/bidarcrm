services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: bidar_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      ESPO_SITE_URL: "http://localhost:8080"
      DATABASE_HOST: db
      DATABASE_NAME: bidarcrm
      DATABASE_USER: bidar
      DATABASE_PASSWORD: bidarpassword
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: bidar_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bidarcrm
      MYSQL_USER: bidar
      MYSQL_PASSWORD: bidarpassword
    volumes:
      - bidar_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bidar_db_data:
