services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: bidar_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/bidar.ini:ro
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/engine
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: bidar_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bidarcrm
      MYSQL_USER: bidar
      MYSQL_PASSWORD: bidarpassword
    volumes:
      - bidar_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bidar_db_data:
